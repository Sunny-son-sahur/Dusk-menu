name: build

# Builds everything on push to main and on tags (v1.0.0 etc).
# Tagged builds also attach the EXEs to a GitHub release.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ── Dusk Launcher (the injector GUI) ───────────────────────────
      - name: Publish Dusk Launcher
        run: |
          dotnet publish DuskLauncher/src/Dusk.Launcher -c Release -r win-x64 `
            --self-contained true -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/launcher

      # ── Dusk Installer ─────────────────────────────────────────────
      - name: Publish Dusk Installer
        run: |
          dotnet publish DuskLauncher/src/Dusk.Installer -c Release -r win-x64 `
            --self-contained true -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/installer

      # Zip the launcher next to the installer so the installer can
      # bundle it offline instead of downloading from a release.
      - name: Bundle launcher for installer
        shell: pwsh
        run: Compress-Archive -Path artifacts/launcher/* -DestinationPath artifacts/installer/DuskLauncher.zip -Force

      # Optional: if a SentinelMenu.dll exists in drop/, carry it along.
      - name: Bundle menu DLL (if present)
        shell: pwsh
        run: |
          if (Test-Path drop/SentinelMenu.dll) { Copy-Item drop/SentinelMenu.dll artifacts/installer/ }

      - uses: actions/upload-artifact@v4
        with:
          name: DuskLauncher-windows-x64
          path: artifacts/

      # Tagged builds publish a release with the two exes.
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/installer/DuskInstaller.exe
            artifacts/launcher/DuskLauncher.exe
            artifacts/installer/DuskLauncher.zip
            artifacts/installer/SentinelMenu.dll