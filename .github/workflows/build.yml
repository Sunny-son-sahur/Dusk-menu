name: build

# Builds everything on push to main and on tags (v1.0.0 etc).
# Tagged builds also attach the EXEs to a GitHub release.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ── Dusk Launcher (the injector GUI) ───────────────────────────
      # Directory build — all DLLs on disk, no single-file extraction.
      # This avoids the Windows side-by-side error on machines that
      # lack the VC++ Redistributable.
      - name: Publish Dusk Launcher
        run: |
          dotnet publish DuskLauncher/src/Dusk.Launcher -c Release -r win-x64 `
            --self-contained true -p:PublishSingleFile=false `
            -o artifacts/launcher

      # Zip the launcher directory for download.
      - name: Zip Dusk Launcher
        shell: pwsh
        run: Compress-Archive -Path artifacts/launcher/* -DestinationPath artifacts/DuskLauncher.zip -Force

      # Optional: if a SentinelMenu.dll exists in drop/, carry it along.
      - name: Bundle menu DLL (if present)
        shell: pwsh
        run: |
          if (Test-Path drop/SentinelMenu.dll) { Copy-Item drop/SentinelMenu.dll artifacts/ }

      - uses: actions/upload-artifact@v4
        with:
          name: DuskLauncher-windows-x64
          path: artifacts/

      # Tagged builds publish a release with the launcher zip.
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/DuskLauncher.zip
            artifacts/SentinelMenu.dll